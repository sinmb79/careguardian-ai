name: Security and release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --run

      - name: Web production build
        run: npm run build

      - name: Static CSP shell check
        run: npm run release:static-security-check

      - name: Mobile type check
        run: npm run mobile:typecheck

      - name: Expo local AI doctor
        run: npm run mobile:doctor

      - name: Non-medical release policy
        run: npm run release:policy-check

      - name: Pinned model registry policy
        run: npm run release:model-check

      - name: Model registry mutation tests
        run: npm run release:model-check:test

      - name: Production dependency audit
        run: npm run release:audit-policy
